[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethoscope"
version = "0.0.1"
description = "Automatic simple behavioural sequences from accelerometer data."
authors = [{name = "Pranav Minasandra"}, {email = "severuscool@gmail.com"}]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "accutils"
]
